name: Dependabot Auto-merge

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  test-and-merge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Run tests
        run: npx start-server-and-test "npm run start" http://localhost:3000 "npm run test:e2e"
      - name: Merge Dependabot PR
        if: success()
        uses: peter-evans/merge-pull-request@v4
        with:
          merge-method: squash
          commit-title: "chore(deps): auto-merge dependabot"
          delete-branch: true
